name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docflow
          POSTGRES_PASSWORD: docflow
          POSTGRES_DB: docflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests run against real Postgres here and SQLite locally.
      DOCFLOW_TEST_DATABASE_URL: postgresql+psycopg://docflow:docflow@localhost:5432/docflow_test
      # Fail (instead of skip) the OCR tests if Tesseract is missing.
      DOCFLOW_REQUIRE_TESSERACT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install DocFlow
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t docflow:ci .

      - name: Smoke test the image
        run: |
          docker run --rm docflow:ci docflow --help
          docker run --rm docflow:ci tesseract --version
