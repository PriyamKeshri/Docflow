[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docflow"
version = "0.1.0"
description = "Automated document-intake pipeline: ingest, LLM extraction, validation, storage and notification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "pdfplumber>=0.11",
  "pytesseract>=0.3.13",
  "pillow>=10.4",
  "anthropic>=1.0",
  "google-genai>=1.20",
  "gspread>=6.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "reportlab>=4.2",
]

[project.scripts]
docflow = "docflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:pdfminer.*"]

[tool.coverage.run]
source = ["docflow"]
omit = ["src/docflow/cli.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults
